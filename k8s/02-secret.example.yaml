# ⚠️ EXAMPLE ONLY — do NOT put real keys in this file and NEVER commit real keys to GitHub.
# Create the real secret from the command line instead:
#   kubectl create secret generic aws-credentials -n fraud \
#     --from-literal=AWS_ACCESS_KEY_ID=<your key id> --from-literal=AWS_SECRET_ACCESS_KEY=<your secret>
# (On EKS the better option is IAM Roles for Service Accounts (IRSA) — then no keys are needed at all.)
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: fraud
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
